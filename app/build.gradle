plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def generateVersionName() {
    def date = new Date()
    def formattedDate = date.format("yyyyMMdd-HHmmss")
    return "build" + formattedDate
}
android {
    compileSdk 36

    defaultConfig {
        applicationId "com.zinhao.kikoeru"
        minSdk 29
        targetSdk 36
        versionCode 15
        versionName generateVersionName()
        javaCompileOptions {
            annotationProcessorOptions {
                compilerArgumentProviders(
                        new RoomSchemaArgProvider(new File(projectDir, "schemas"))
                )
            }
        }
    }
    signingConfigs {
        if (System.getenv("KEYSTORE_PASSWORD") != null &&
                System.getenv("KEY_ALIAS") != null &&
                System.getenv("KEY_PASSWORD") != null) {
            release {
                // CI / 本地如果给了环境变量就用；否则这段根本不执行
                storeFile file(System.getenv("KEYSTORE_FILE") ?: "C:/Users/q1521/OneDrive/Jks/kikoeru-android-key")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = signingConfigs.findByName("release") ?: signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 禁用 Lint 检查
            lintOptions {
                checkReleaseBuilds false  // 关闭 Release 的 Lint 检查
                abortOnError false        // 即使发现错误也不中断构建
            }
            applicationVariants.configureEach { variant ->
                variant.outputs.configureEach { output ->
                    // 获取版本号
                    def versionName = variant.versionName
                    // 获取构建类型 (debug/release)
                    def buildType = variant.buildType.name
                    // 自定义文件名格式: 项目名_v版本号_日期_构建类型.apk
                    def fileName = "Kikoeru_${versionName}_${buildType}.apk"
                    outputFileName = fileName
                }
            }
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.zinhao.kikoeru'
}

dependencies {
    implementation "androidx.core:core-splashscreen:1.0.0-beta02"
    implementation 'androidx.core:core-ktx:1.18.0'
    def room_version = "2.5.2"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: ["guava-27.1-android.jar"])
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    //room
    //noinspection GradleDependency
    implementation ("androidx.room:room-runtime:$room_version")
    annotationProcessor ("androidx.room:room-compiler:$room_version")
    //调色板
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'com.google.guava:guava:33.6.0-jre'

    // MVVM - Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.10.0'

    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.14.0'

    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
}

class RoomSchemaArgProvider implements CommandLineArgumentProvider {

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    File schemaDir

    RoomSchemaArgProvider(File schemaDir) {
        this.schemaDir = schemaDir
    }

    @Override
    Iterable<String> asArguments() {
        // Note: If you're using KSP, you should change the line below to return
        // ["room.schemaLocation=${schemaDir.path}"]
        return ["-Aroom.schemaLocation=${schemaDir.path}"]
    }
}
